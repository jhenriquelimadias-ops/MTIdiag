<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTIdiag</title><link rel="icon" type="image/png" sizes="32x32" href="icon-32.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1D1D1D">
<style>
:root{--bg:#1D1D1D;--g:#369A26;--o:#4A5F43;--l:#9AC57E;--p:rgba(255,255,255,.05);--p2:rgba(255,255,255,.1);--t:#fff;--m:rgba(255,255,255,.6);--a:#9AC57E;--r:8px;--bd:rgba(154,197,126,.2);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{width:210px;background:var(--p);border-right:1px solid var(--bd);padding:14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 18px}.brand img{height:40px;width:auto}.brand b{font-size:20px;letter-spacing:.3px}.brand b i{color:var(--l);font-style:normal}.hero{display:flex;align-items:center;gap:16px;margin-bottom:18px}.hero .sy{height:76px;width:auto}.hero .tx{height:36px;width:auto;margin-bottom:6px}.ph{margin:0 0 16px}.ph img{height:26px;width:auto}.ft{margin-top:34px;padding-top:14px;border-top:1px solid var(--bd);display:flex;justify-content:center}.ft img{height:20px;width:auto;opacity:.85}#sp{position:fixed;inset:0;background:#1D1D1D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;transition:opacity .4s}#sp img{height:110px;animation:pl 1.2s infinite alternate}#sp b{font-size:26px;color:#fff}#sp i{color:var(--l);font-style:normal}@keyframes pl{to{opacity:.55}}
nav button{display:block;width:100%;text-align:left;background:0;border:0;color:var(--m);padding:11px;border-radius:var(--r);font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:var(--o);color:#fff}
main{flex:1;padding:22px;max-width:1000px;min-width:0}h2{margin-top:0}h3{color:var(--a);font-size:15px;margin:22px 0 8px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;color:var(--m);font-size:13px}
input,select,textarea{width:100%;margin-top:4px;background:var(--bg);color:var(--t);border:1px solid var(--bd);border-radius:var(--r);padding:9px;font:inherit}
input[type=checkbox]{width:auto;margin:0 8px 0 0}textarea{resize:vertical}
button.b{background:var(--g);color:#fff;border:0;border-radius:var(--r);padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
button.s{background:var(--o);color:#fff}button.d{background:transparent;color:var(--l);border:1px solid var(--l)}input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:transparent}
.k{font-size:30px;font-weight:700;color:var(--a)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tt{display:grid;grid-template-columns:230px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.tag{background:var(--o);color:#fff!important;border-radius:20px;padding:2px 10px;font-size:12px;color:var(--a)}.m{color:var(--m)}
.rep{background:#fff;color:#111;padding:28px;border-radius:var(--r)}.rh{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;background:#1D1D1D;color:rgba(255,255,255,.7);padding:12px 16px;border-radius:8px;font-size:12px}.rh img{height:30px;width:auto}.rep h1{margin:0;font-size:20px;border-bottom:3px solid #369A26;padding-bottom:8px;color:#1D1D1D}
.rep h2{font-size:15px;margin:18px 0 6px;color:#4A5F43;text-transform:uppercase}.rep table{width:100%;border-collapse:collapse}
.rep td{padding:5px 8px;border-bottom:1px solid #9AC57E;vertical-align:top}.rep td:first-child{width:35%;font-weight:600;background:rgba(154,197,126,.2)}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:6px}.brand b{display:none}.brand{margin:0 8px 0 0}.brand img{height:30px}.hero .sy{display:none}nav button{white-space:nowrap;width:auto}.tt{grid-template-columns:1fr}main{padding:12px}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}nav,.noprint{display:none!important}body{display:block;background:#fff}main{padding:0}.rep{padding:0}}
</style></head><body>
<div id="sp"><img src="logo-simbolo.png" alt="MTIdiag"></div><nav><div class="brand"><img src="logo-simbolo.png" alt="MTIdiag"></div><button data-v="dash">Dashboard</button><button data-v="novo">Novo atendimento</button><button data-v="hist">Histórico</button><button data-v="rel">Relatórios</button><button data-v="cfg">Configurações</button></nav>
<main><div class="ph noprint" id="ph"><img src="logo-texto.png" alt="MTIdiag"></div><div id="m"></div><div class="ft noprint"><img src="logo-texto.png" alt="MTIdiag"></div></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,cur={};const op=indexedDB.open('diagpc',1);op.onupgradeneeded=()=>op.result.createObjectStore('at',{keyPath:'id',autoIncrement:true});
const ready=new Promise(r=>op.onsuccess=()=>{D=op.result;r()});
const tx=(m,f)=>new Promise((ok,er)=>{const t=D.transaction('at',m),q=f(t.objectStore('at'));t.oncomplete=()=>ok(q.result);t.onerror=er});
const all=()=>tx('readonly',s=>s.getAll()),put=r=>tx('readwrite',s=>s.put(r)),del=id=>tx('readwrite',s=>s.delete(id)),get=id=>tx('readonly',s=>s.get(id));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),fd=d=>d?d.split('-').reverse().join('/'):'';
const TESTES=['Verificação de saúde do SSD/HD','Teste de memória RAM','Verificação de temperatura','Teste de processador','Teste de placa-mãe','Verificação de integridade do Windows','Verificação de vírus e malware','Teste de inicialização','Verificação de drivers','Teste de desempenho','Verificação de erros no sistema','Outros'];
const STAT=['Em análise','Aguardando aprovação','Aguardando manutenção','Concluído','Encaminhado ao responsável'],CATS=['Computador lento','Travamentos','Tela azul','Problemas de inicialização','Falhas no armazenamento','Problemas de memória RAM','Problemas de temperatura','Problemas de software','Outros'],FMT=['A avaliar','Sim','Não'];
const HW=[['Placa-mãe',[['mbF','Fabricante'],['mbM','Modelo']]],['Processador',[['cpuF','Fabricante'],['cpuM','Modelo completo'],['cpuN','Núcleos']]],['Memória RAM',[['ramC','Capacidade total (ex: 16 GB)'],['ramF','Frequência (ex: 3200 MHz)'],['ramQ','Qtd. de módulos','number'],['ramT','Tipo',['','DDR3','DDR4','DDR5','Outro']]]],['Armazenamento',[['stT','Tipo',['','SSD SATA','SSD NVMe','HD']],['stM','Fabricante e modelo'],['stC','Capacidade (ex: 480 GB)'],['stS','Saúde do disco (%)','number'],['stV','Vida útil restante (%)','number'],['stD','Dias de funcionamento','number'],['stH','Horas de funcionamento','number'],['stP','Temperatura (°C)','number']]]];
const inp=(k,l,v,o,t='text')=>`<label>${l}${o?`<select data-k="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:t=='ta'?`<textarea data-k="${k}" rows="3">${E(v)}</textarea>`:`<input data-k="${k}" type="${t}" value="${E(v)}">`}</label>`;
const probRow=p=>`<div class="pb row"><select style="width:200px">${CATS.map(c=>`<option ${c==p.cat?'selected':''}>${c}</option>`).join('')}</select><textarea rows="2" style="flex:1" placeholder="Descreva o problema">${E(p.txt)}</textarea><button class="b d" onclick="this.parentNode.remove()">✕</button></div>`;
const addProb=()=>$('#pl').insertAdjacentHTML('beforeend',probRow({cat:CATS[0],txt:''}));
function go(v,a){$('#ph').style.display=v=='dash'||v=='rel'?'none':'flex';$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));scrollTo(0,0);({dash,novo:()=>novo(a),hist,rel:()=>rel(a),cfg})[v]()}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
async function dash(){const a=(await all()).sort((x,y)=>y.id-x.id),n=s=>a.filter(r=>r.status==s).length;
$('#m').innerHTML=`<div class="hero"><img class="sy" src="logo-simbolo.png" alt=""><div><img class="tx" src="logo-texto.png" alt="MTIdiag"><br><span class="m">Diagnóstico e registro técnico de computadores</span></div></div><div class="g"><div class="card"><div class="k">${a.length}</div>Atendimentos</div><div class="card"><div class="k">${n('Em análise')}</div>Em análise</div><div class="card"><div class="k">${n('Concluído')}</div>Concluídos</div></div><button class="b" onclick="go('novo')">➕ Novo atendimento</button><h3>Últimos atendimentos</h3><div class="card">${lst(a.slice(0,6))}</div>`}
const lst=a=>a.length?a.map(r=>`<div class="row"><div><b>${E(r.cliente)}</b> · ${E(r.pc)}<br><span class="m">${fd(r.data)}</span> <span class="tag">${E(r.status)}</span></div><div><button class="b s" onclick="go('rel',${r.id})">Ver / Relatório</button><button class="b s" onclick="go('novo',${r.id})">Editar</button><button class="b d" onclick="rm(${r.id})">Excluir</button></div></div>`).join(''):'<p class="m">Nenhum atendimento.</p>';
async function rm(id){if(confirm('Excluir este atendimento? Não é possível desfazer.')){await del(id);go($('nav .on').dataset.v)}}
async function novo(id){cur=id?await get(id):{data:today(),status:STAT[0],fmt:'A avaliar',probs:[],testes:{}};const r=cur;
$('#m').innerHTML=`<h2>${id?'Editar':'Novo'} atendimento</h2><div class="card"><h3>Cliente</h3><div class="g">${inp('cliente','Cliente / empresa *',r.cliente)}${inp('data','Data',r.data,0,'date')}${inp('pc','Identificação do computador *',r.pc)}${inp('patrimonio','Nº de patrimônio',r.patrimonio)}${inp('resp','Responsável',r.resp)}</div></div>
<div class="card"><h3 style="margin-top:0">Hardware</h3>${HW.map(([g,f])=>`<h3>${g}</h3><div class="g">${f.map(([k,l,t,o])=>inp(k,l,r[k],Array.isArray(t)?t:0,Array.isArray(t)?'':t)).join('')}</div>`).join('')}</div>
<div class="card"><h3 style="margin-top:0">Problemas encontrados</h3><div id="pl">${(r.probs.length?r.probs:[{cat:CATS[0],txt:''}]).map(probRow).join('')}</div><button class="b s" onclick="addProb()">+ Adicionar problema</button></div>
<div class="card"><h3 style="margin-top:0">Testes realizados</h3>${TESTES.map(t=>{const x=r.testes[t]||{};return`<div class="tt" data-n="${t}"><label style="color:var(--t)"><input type="checkbox" ${x.ok?'checked':''}>${t}</label><input class="res" placeholder="Resultado" value="${E(x.res)}"><input class="obs" placeholder="Observações" value="${E(x.obs)}"></div>`}).join('')}</div>
<div class="card"><h3 style="margin-top:0">Necessita de formatação? *</h3><div class="g">${inp('fmt','Resposta',r.fmt,FMT)}</div>${inp('fmtObs','Motivo / observações',r.fmtObs,0,'ta')}</div>
<div class="card"><h3 style="margin-top:0">Conclusão</h3><div class="g">${inp('status','Status',r.status,STAT)}${inp('sit','Situação atual do computador',r.sit)}</div>${inp('diag','Diagnóstico final',r.diag,0,'ta')}${inp('probs2','Problemas identificados',r.probs2,0,'ta')}${inp('proc','Procedimentos realizados',r.proc,0,'ta')}${inp('rec','Recomendações técnicas',r.rec,0,'ta')}${inp('obsA','Observações adicionais',r.obsA,0,'ta')}</div>
<button class="b" onclick="save()">💾 Salvar</button><button class="b s" onclick="go('hist')">Cancelar</button>`}
async function save(){const r={...cur};$$('[data-k]').forEach(e=>r[e.dataset.k]=e.value);if(!r.cliente.trim()||!r.pc.trim())return alert('Preencha cliente e identificação do computador.');
r.testes={};$$('.tt').forEach(e=>r.testes[e.dataset.n]={ok:e.querySelector('[type=checkbox]').checked,res:e.querySelector('.res').value,obs:e.querySelector('.obs').value});
r.probs=$$('.pb').map(e=>({cat:e.querySelector('select').value,txt:e.querySelector('textarea').value})).filter(p=>p.txt.trim());
const id=await put(r);go('rel',r.id||id)}
async function hist(){const a=(await all()).sort((x,y)=>y.id-x.id);$('#m').innerHTML=`<h2>Histórico</h2><div class="card"><div class="g"><label>Buscar (cliente ou computador)<input id="q"></label><label>De<input id="d1" type="date"></label><label>Até<input id="d2" type="date"></label></div></div><div class="card" id="hl"></div>`;
const f=()=>{const q=$('#q').value.toLowerCase(),d1=$('#d1').value,d2=$('#d2').value;$('#hl').innerHTML=lst(a.filter(r=>(!q||(r.cliente+' '+r.pc+' '+(r.mbM||'')+' '+(r.cpuM||'')).toLowerCase().includes(q))&&(!d1||r.data>=d1)&&(!d2||r.data<=d2)))};$$('#m input').forEach(i=>i.oninput=f);f()}
function sec(r){const o=(l,v)=>[l,v],S=[['Resumo',[o('Situação',`Computador ${r.pc} de ${r.cliente}. Status: ${r.status}. Necessita de formatação: ${r.fmt}.`),o('Diagnóstico',r.diag)]],['Atendimento',[o('Cliente / empresa',r.cliente),o('Data',fd(r.data)),o('Computador',r.pc),o('Patrimônio',r.patrimonio),o('Responsável',r.resp)]]];
HW.forEach(([g,f])=>S.push([g,f.map(([k,l])=>o(l,r[k]))]));
S.push(['Problemas encontrados',r.probs.map(p=>o(p.cat,p.txt)).concat([o('Problemas identificados',r.probs2)])],['Testes realizados',Object.entries(r.testes).filter(t=>t[1].ok).map(([n,t])=>o(n,[t.res,t.obs].filter(Boolean).join(' — ')||'Realizado'))],['Necessita de formatação?',[o('Resposta',r.fmt),o('Motivo',r.fmtObs)]],['Conclusão',[o('Procedimentos realizados',r.proc),o('Recomendações',r.rec),o('Situação atual',r.sit),o('Observações adicionais',r.obsA)]]);
return S.map(([t,l])=>[t,l.filter(x=>x[1]||x[1]===0)]).filter(s=>s[1].length)}
const txt=(r,w)=>`${w?'*':''}MTIdiag - RELATÓRIO TÉCNICO DE COMPUTADOR${w?'*':''}\n\n`+sec(r).map(([t,l])=>(w?`*${t}*`:`== ${t.toUpperCase()} ==`)+'\n'+l.map(([a,b])=>`${w?'• ':''}${a}: ${b}`).join('\n')).join('\n\n');
const html=r=>`<div class="rh"><img src="logo-texto.png" alt="MTIdiag"><span>Diagnóstico e registro técnico de computadores</span></div><h1>Relatório Técnico de Computador</h1>`+sec(r).map(([t,l])=>`<h2>${t}</h2><table>${l.map(([a,b])=>`<tr><td>${E(a)}<td>${E(b).replace(/\n/g,'<br>')}`).join('')}</table>`).join('');
let RR;const dl=(n,c,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()},fn=r=>`MTIdiag_${r.cliente}_${r.pc}_${r.data}`.replace(/[^\w\-]+/g,'_');
async function rel(id){const a=(await all()).sort((x,y)=>y.id-x.id);if(!a.length){$('#m').innerHTML='<h2>Relatórios</h2><p class="m">Nenhum atendimento cadastrado.</p>';return}
id=id||a[0].id;RR=a.find(r=>r.id==id);$('#m').innerHTML=`<h2>Relatórios</h2><div class="noprint"><label>Atendimento<select onchange="rel(+this.value)">${a.map(r=>`<option value="${r.id}" ${r.id==id?'selected':''}>${fd(r.data)} · ${E(r.cliente)} · ${E(r.pc)}</option>`).join('')}</select></label><br>
<button class="b" onclick="document.title=fn(RR);print()">📄 Gerar PDF</button><button class="b s" onclick="navigator.clipboard.writeText(txt(RR,1)).then(()=>alert('Relatório copiado! Cole no WhatsApp ou e-mail.'))">📋 Copiar relatório</button><button class="b s" onclick="dl(fn(RR)+'.txt',txt(RR),'text/plain')">💾 Exportar arquivo</button><button class="b s" onclick="share()">📤 Compartilhar</button><button class="b s" onclick="go('novo',RR.id)">✏ Editar</button></div><div class="rep">${html(RR)}</div>`}
function share(){navigator.share?navigator.share({title:'Relatório técnico',text:txt(RR,1)}):navigator.clipboard.writeText(txt(RR,1)).then(()=>alert('Compartilhamento não disponível aqui. Relatório copiado.'))}
async function cfg(){$('#m').innerHTML=`<h2>Configurações</h2><div class="card"><h3 style="margin-top:0">Instalar aplicativo</h3><p class="m">Instale o MTIdiag no celular ou no computador para abrir como um aplicativo, mesmo sem internet.</p><button class="b" onclick="inst()">📲 Instalar app</button></div><div class="card"><h3 style="margin-top:0">Backup</h3><p class="m">Os dados ficam salvos neste dispositivo. Faça backup com frequência (e use-o para levar os dados do PC ao celular).</p><button class="b" onclick="bk()">⬇ Exportar backup</button><label class="b s" style="display:inline-block;color:var(--t)">⬆ Restaurar backup<input type="file" accept=".json" hidden onchange="rs(this.files[0])"></label></div>`}
let IP;addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e});
function inst(){if(matchMedia('(display-mode:standalone)').matches)return alert('O app já está instalado e aberto como aplicativo.');
if(IP){IP.prompt();IP=null;return}
alert(location.protocol=='file:'?'Para instalar, o MTIdiag precisa estar hospedado em um endereço https (ex.: Netlify Drop ou GitHub Pages). Abrindo o arquivo direto do computador, o navegador não permite a instalação. No Windows, continue usando o Iniciar_MTIdiag.bat.':'Use o menu do navegador (⋮ ou compartilhar) e escolha "Instalar app" ou "Adicionar à tela inicial".')}
async function bk(){dl(`backup_diagpc_${today()}.json`,JSON.stringify(await all()),'application/json')}
async function rs(f){try{const a=JSON.parse(await f.text());for(const r of a)await put(r);alert(a.length+' registros restaurados.');go('hist')}catch(e){alert('Arquivo inválido.')}}
ready.then(()=>{go('dash');setTimeout(()=>{$('#sp').style.opacity=0;setTimeout(()=>$('#sp').remove(),450)},500)});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
